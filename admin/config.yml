backend:
  name: github
  repo: frisolaan/projet-interculturel-edd
  branch: main
  base_url: https://projet-interculturel-edd.vercel.app
  auth_endpoint: api/auth
media_folder: assets/uploads
public_folder: /assets/uploads
collections:
- name: parcours
  label: Parcours (Startseite)
  files:
  - name: parcours
    label: Startseite und Rahmen
    file: content/parcours.json
    format: json
    fields:
    - label: Titel
      name: titre
      widget: string
    - label: Untertitel
      name: sous_titre
      widget: string
    - label: Semester
      name: semestre
      widget: string
    - label: Einleitung
      name: intro
      widget: markdown
    - label: Cadre de travail
      name: cadre
      widget: markdown
    - label: Objectifs
      name: objectifs
      widget: list
    - label: 'Infofenster: Titel'
      name: info_titre
      widget: string
    - label: 'Infofenster: Text (erscheint beim Start, muss bestätigt werden)'
      name: info
      widget: markdown
    - label: Hinweis zum Speichern
      name: sauvegarde
      widget: markdown
    - label: Mode d’emploi (Anleitung in der App)
      name: mode_emploi
      widget: list
      summary: '{{fields.titre}}'
      fields:
      - label: Titel
        name: titre
        widget: string
      - label: Text
        name: texte
        widget: markdown
    - label: Reihenfolge der Tâches (IDs)
      name: taches
      widget: list
- name: taches
  label: Tâches
  files:
  - name: t1
    label: Tâche 1 · Qu’est-ce que la culture ?
    file: content/taches/t1.json
    format: json
    fields:
    - label: ID (nicht ändern)
      name: id
      widget: string
    - label: Nummer
      name: numero
      widget: string
    - label: Titel
      name: titre
      widget: string
    - label: Kurztitel (Navigation)
      name: titre_court
      widget: string
    - label: Dauer
      name: duree
      widget: string
    - label: Sozialform
      name: modalite
      widget: string
    - label: Resultat / Produkte
      name: resultat
      widget: text
    - label: Blöcke
      name: blocs
      widget: list
      label_singular: Block
      summary: '{{fields.id}} · {{fields.titre}}{{fields.label}}'
      types:
      - label: Konsigne (Aufgabenstellung)
        name: consigne
        widget: object
        fields:
        - label: ID (nicht ändern)
          name: id
          widget: string
          hint: 'Technische Kennung. Antworten der Studierenden hängen daran – bestehende IDs nie umbenennen. Für neue Blöcke: eindeutig, z. B. t2-6-notes.'
        - label: Titel
          name: titre
          widget: string
        - label: Einstiegsfrage (kursiv, kurz und einladend)
          name: accroche
          widget: string
          required: false
        - label: Dauer
          name: duree
          widget: string
          required: false
        - label: Sozialform
          name: modalite
          widget: string
          required: false
        - label: Text
          name: corps
          widget: markdown
        - label: Text zugeklappt anzeigen («Consigne détaillée»)
          name: repliee
          widget: boolean
          required: false
          default: false
      - label: Text (Lesetext, Situation, Gedicht)
        name: texte
        widget: object
        fields:
        - label: ID (nicht ändern)
          name: id
          widget: string
          hint: 'Technische Kennung. Antworten der Studierenden hängen daran – bestehende IDs nie umbenennen. Für neue Blöcke: eindeutig, z. B. t2-6-notes.'
        - label: Titel
          name: titre
          widget: string
          required: false
        - label: Text
          name: corps
          widget: markdown
        - label: Zugeklappt anzeigen
          name: repliable
          widget: boolean
          required: false
          default: false
      - label: Antwortfeld
        name: reponse
        widget: object
        fields:
        - label: ID (nicht ändern)
          name: id
          widget: string
          hint: 'Technische Kennung. Antworten der Studierenden hängen daran – bestehende IDs nie umbenennen. Für neue Blöcke: eindeutig, z. B. t2-6-notes.'
        - label: Beschriftung
          name: label
          widget: string
        - label: Platzhalter / Hilfe im Feld
          name: aide
          widget: text
          required: false
        - label: Grösse
          name: longueur
          widget: select
          options:
          - court
          - moyen
          - long
          default: long
        - label: Zielwortzahl (0 = keine)
          name: mots_cible
          widget: number
          value_type: int
          default: 0
        - label: Privat (bleibt lokal, nicht im Dossier)
          name: prive
          widget: boolean
          default: false
        - label: Titel im PDF (optional, statt der Frage)
          name: titre_pdf
          widget: string
          required: false
      - label: Tabelle
        name: tableau
        widget: object
        fields:
        - label: ID (nicht ändern)
          name: id
          widget: string
          hint: 'Technische Kennung. Antworten der Studierenden hängen daran – bestehende IDs nie umbenennen. Für neue Blöcke: eindeutig, z. B. t2-6-notes.'
        - label: Beschriftung
          name: label
          widget: string
        - label: Spalten
          name: colonnes
          widget: list
        - label: Beispielzeilen (je Zeile eine Liste der Zellen)
          name: exemples
          widget: list
          required: false
          field:
            label: Zeile
            name: ligne
            widget: list
        - label: Anzahl leere Zeilen
          name: lignes
          widget: number
          value_type: int
          default: 3
        - label: Titel im PDF (optional, statt der Frage)
          name: titre_pdf
          widget: string
          required: false
      - label: Sortierübung (mit Selbstcheck)
        name: tri
        widget: object
        fields:
        - label: ID (nicht ändern)
          name: id
          widget: string
          hint: 'Technische Kennung. Antworten der Studierenden hängen daran – bestehende IDs nie umbenennen. Für neue Blöcke: eindeutig, z. B. t2-6-notes.'
        - label: Anweisung
          name: consigne
          widget: string
        - label: Darstellung
          name: visuel
          widget: select
          options:
          - label: Spalten
            value: colonnes
          - label: 'Baum (2 Kategorien: Krone / Wurzeln)'
            value: arbre
          default: colonnes
          required: false
        - label: Wörter aus Mindmap übernehmen (ID der Mindmap, optional)
          name: mots_de
          widget: string
          required: false
        - label: Kategorien
          name: categories
          widget: list
          fields:
          - label: Kennung
            name: id
            widget: string
            hint: kurz, ohne Leerzeichen, z. B. racines
          - label: Beschriftung
            name: label
            widget: string
        - label: Elemente
          name: elements
          widget: list
          summary: '{{fields.texte}} → {{fields.solution}}'
          fields:
          - label: Text
            name: texte
            widget: string
          - label: Lösung (Kategorie-Kennung oder «les-deux»)
            name: solution
            widget: string
          - label: Erklärung (wird nach dem Prüfen gezeigt)
            name: explication
            widget: string
            required: false
        - label: Eigene Beispiele erlauben
          name: ajout_libre
          widget: boolean
          default: false
        - label: Redaktionsstatus (nur im Redaktionsmodus sichtbar)
          name: statut_contenu
          widget: string
          required: false
          hint: z. B. «Entwurf – à valider». Leeren, sobald der Inhalt freigegeben ist.
        - label: Titel im PDF (optional, statt der Frage)
          name: titre_pdf
          widget: string
          required: false
      - label: Selbstcheck (Checkliste + Beispiel)
        name: autocontrole
        widget: object
        fields:
        - label: ID (nicht ändern)
          name: id
          widget: string
          hint: 'Technische Kennung. Antworten der Studierenden hängen daran – bestehende IDs nie umbenennen. Für neue Blöcke: eindeutig, z. B. t2-6-notes.'
        - label: Titel
          name: titre
          widget: string
        - label: Prüfpunkte
          name: points
          widget: list
        - label: Titel des Beispiels
          name: exemple_titre
          widget: string
          required: false
        - label: Beispiel / Musterlösung
          name: exemple
          widget: markdown
          required: false
        - label: Redaktionsstatus (nur im Redaktionsmodus sichtbar)
          name: statut_contenu
          widget: string
          required: false
          hint: z. B. «Entwurf – à valider». Leeren, sobald der Inhalt freigegeben ist.
      - label: Externe Ressource (ILIAS, Lehrmittel …)
        name: externe
        widget: object
        fields:
        - label: ID (nicht ändern)
          name: id
          widget: string
          hint: 'Technische Kennung. Antworten der Studierenden hängen daran – bestehende IDs nie umbenennen. Für neue Blöcke: eindeutig, z. B. t2-6-notes.'
        - label: Titel
          name: titre
          widget: string
        - label: Text
          name: corps
          widget: markdown
          required: false
        - label: Links
          name: liens
          widget: list
          required: false
          fields:
          - label: Beschriftung
            name: label
            widget: string
          - label: URL
            name: url
            widget: string
            required: false
      - label: Lehrplan-Fenster
        name: lehrplan
        widget: object
        fields:
        - label: ID (nicht ändern)
          name: id
          widget: string
          hint: 'Technische Kennung. Antworten der Studierenden hängen daran – bestehende IDs nie umbenennen. Für neue Blöcke: eindeutig, z. B. t2-6-notes.'
        - label: Titel
          name: titre
          widget: string
        - label: Text
          name: corps
          widget: markdown
          required: false
        - label: Schaltflächen
          name: liens
          widget: list
          hint: Entweder ein Suchwort (öffnet die Lehrplan-Suche) oder eine URL auf tg.lehrplan.ch.
          fields:
          - label: Beschriftung
            name: label
            widget: string
          - label: Suchwort
            name: recherche
            widget: string
            required: false
          - label: URL
            name: url
            widget: string
            required: false
      - label: Weiterführender Bezug (z. B. A Rounder Sense of Purpose)
        name: repere
        widget: object
        fields:
        - label: ID (nicht ändern)
          name: id
          widget: string
        - label: Titel
          name: titre
          widget: string
        - label: Text
          name: corps
          widget: markdown
          required: false
        - label: Links
          name: liens
          widget: list
          fields:
          - label: Beschriftung
            name: label
            widget: string
          - label: URL
            name: url
            widget: string
        - label: Quelle / Lizenz
          name: source
          widget: string
          required: false
      - label: Rückblick (zeigt eine frühere Antwort)
        name: rappel
        widget: object
        fields:
        - label: ID (nicht ändern)
          name: id
          widget: string
          hint: 'Technische Kennung. Antworten der Studierenden hängen daran – bestehende IDs nie umbenennen. Für neue Blöcke: eindeutig, z. B. t2-6-notes.'
        - label: Titel
          name: titre
          widget: string
        - label: ID der früheren Antwort
          name: source
          widget: string
        - label: Text darunter
          name: corps
          widget: markdown
          required: false
      - label: Silhouette (Wörter platzieren)
        name: silhouette
        widget: object
        fields:
        - label: ID (nicht ändern)
          name: id
          widget: string
          hint: 'Technische Kennung. Antworten der Studierenden hängen daran – bestehende IDs nie umbenennen. Für neue Blöcke: eindeutig, z. B. t2-6-notes.'
        - label: Privat
          name: prive
          widget: boolean
          default: true
      - label: Karte zum Drucken (z. B. Störkarte)
        name: carte
        widget: object
        fields:
        - label: ID (nicht ändern)
          name: id
          widget: string
          hint: 'Technische Kennung. Antworten der Studierenden hängen daran – bestehende IDs nie umbenennen. Für neue Blöcke: eindeutig, z. B. t2-6-notes.'
        - label: Titel
          name: titre
          widget: string
        - label: IDs der Antwortfelder auf der Karte
          name: champs
          widget: list
      - label: Audio (MP3 hochladen)
        name: audio
        widget: object
        fields:
        - label: ID (nicht ändern)
          name: id
          widget: string
        - label: Titel
          name: titre
          widget: string
        - label: Datei
          name: fichier
          widget: file
          hint: MP3, möglichst unter 5 MB
        - label: Legende (z. B. Quelle, Stimme)
          name: legende
          widget: string
          required: false
      - label: Schema (vordefinierte Grafik)
        name: schema
        widget: object
        fields:
        - label: ID (nicht ändern)
          name: id
          widget: string
        - label: Modell
          name: modele
          widget: select
          options:
          - label: Kopf – Herz – Hand
            value: tete-coeur-main
        - label: Bildlegende
          name: legende
          widget: string
          required: false
      - label: Abgabe auf ILIAS
        name: remise
        widget: object
        fields:
        - label: ID (nicht ändern)
          name: id
          widget: string
        - label: Was wird abgegeben?
          name: titre
          widget: string
        - label: Hinweise
          name: corps
          widget: markdown
          required: false
        - label: Link zur ILIAS-Abgabe
          name: url
          widget: string
          required: false
        - label: Termin (optional)
          name: echeance
          widget: string
          required: false
      - label: Mindmap
        name: mindmap
        widget: object
        fields:
        - label: ID (nicht ändern)
          name: id
          widget: string
        - label: Beschriftung
          name: label
          widget: string
        - label: Wort in der Mitte
          name: centre
          widget: string
        - label: Privat
          name: prive
          widget: boolean
          default: false
        - label: Titel im PDF (optional, statt der Frage)
          name: titre_pdf
          widget: string
          required: false
      - label: Auszug aus einem Text (Absätze ¶)
        name: extrait
        widget: object
        fields:
        - label: ID (nicht ändern)
          name: id
          widget: string
        - label: Titel
          name: titre
          widget: string
        - label: ID des Textblocks
          name: source
          widget: string
        - label: Absatznummern
          name: paragraphes
          widget: list
          field:
            label: Nummer
            name: n
            widget: number
            value_type: int
