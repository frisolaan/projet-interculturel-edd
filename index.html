<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compétences interculturelles et ÉDD</title>
  <meta name="theme-color" content="#FFFFFF">
  <script>try{var t=new URLSearchParams(location.search).get("theme")||localStorage.getItem("pi-edd-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">☰</button>
    <a class="brand" href="#/"><svg viewBox="0 0 32 22" aria-hidden="true"><circle cx="11" cy="11" r="9" style="fill:var(--m1);fill-opacity:.9"/><circle cx="21" cy="11" r="9" style="fill:var(--m3);fill-opacity:.85;mix-blend-mode:multiply"/></svg><span>Compétences interculturelles</span></a>
    <div class="actions">
      <span data-save-status class="save-status" aria-live="polite"></span>
      <a href="#/aide" class="btn ghost small" title="Comment travailler avec l’application">Mode d’emploi</a>
      <button id="btn-lp" class="btn ghost small">Plan d’études</button>
      <button id="btn-open" class="btn ghost small" title="Reprendre à partir de votre fichier de parcours">Ouvrir mon fichier</button>
      <button id="btn-save" class="btn save small" title="Enregistrer votre parcours dans un fichier"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3h9l3 3v11H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 3v4h6V3M7 17v-5h6v5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>Enregistrer<span class="dirty-dot" aria-hidden="true"></span></button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Parcours"></nav>
    <main id="main" tabindex="-1"><p class="loading">Chargement…</p></main>
  </div>

  <aside class="drawer" id="drawer" aria-label="Plan d’études" hidden>
    <div class="drawer-head">
      <form id="lp-search" class="lp-search">
        <input type="search" id="lp-q" placeholder="Rechercher, p. ex. Kulturen" aria-label="Recherche dans le plan d’études">
        <button class="btn primary small" type="submit">Chercher</button>
      </form>
      <a id="lp-newtab" class="btn ghost small" target="_blank" rel="noopener" title="Ouvrir dans un nouvel onglet">↗</a>
      <button class="icon-btn" id="drawer-close" aria-label="Fermer">✕</button>
    </div>
    <iframe id="lp-frame" title="Lehrplan Volksschule Thurgau" src="about:blank"></iframe>
    <p class="drawer-note">Affiché en direct depuis tg.lehrplan.ch — © D-EDK / Kanton Thurgau</p>
  </aside>

  <input type="file" id="file-input" accept=".json,application/json" hidden>
  <div id="print-area" class="print-area"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
